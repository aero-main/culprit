<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>범인찾기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 안개 낀 밤의 추리극, 짧고 긴장감 있게
   IDEA: 원탁에 둘러앉은 일곱 색의 용의자, 가운데엔 첫 희생자
   PICTURE: 원형 좌석판 + 흘러가는 안개
   COLOUR and TYPE: 깊은 밤색 바탕, 핏빛 강조, 일곱 색 토큰 / Black Han Sans + Noto Sans KR
   LAYOUT: 위 상태줄, 가운데 원탁, 아래 행동판과 기록 */
:root{color-scheme:dark;--bg:#120f18;--pan:#1d1826;--pan2:#262033;--ink:#efe9f6;--dim:#a79fb6;--line:#3a3248;--red:#e0313f;--gold:#f2c14e}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,#2a2035 0%,var(--bg) 60%) fixed;color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--pan2);border-radius:10px;min-height:44px;padding:8px 14px}
button:hover{border-color:#6b5d80}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--red);border-color:var(--red);font-weight:700}
button.on{outline:3px solid var(--gold);outline-offset:1px}
input,select{font:inherit;font-size:16px;color:var(--ink);background:#0d0b12;border:1px solid var(--line);border-radius:10px;min-height:44px;padding:8px 12px}
h1,h2,h3{font-family:"Black Han Sans",sans-serif;font-weight:400;margin:0;line-height:1.1}
.wrap{max-width:1180px;margin:0 auto;padding:12px max(3vw,12px) 40px}
#menu{max-width:560px;margin:0 auto;padding:40px 16px}
#menu h1{font-size:clamp(48px,12vw,84px);color:var(--red);text-shadow:0 4px 0 #000}
#menu .sub{color:var(--dim);margin:4px 0 26px}
.card{background:var(--pan);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>input{flex:1}
.lbl{font-size:13px;color:var(--dim);margin:0 0 6px}
#game{display:none}
.top{display:flex;align-items:center;gap:12px;padding:6px 0 10px;flex-wrap:wrap}
.top h2{font-size:24px;color:var(--red)}
#phase{font-weight:700}#timer{margin-left:auto;font-family:"Black Han Sans";font-size:26px;min-width:64px;text-align:right}
#timer.hot{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
#game{display:none;height:100vh;height:100dvh;flex-direction:column;max-width:1240px;margin:0 auto;padding:6px max(2vw,10px) 10px;overflow:hidden}
.top{flex:none}#now{flex:none}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.left,.right{display:flex;flex-direction:column;min-height:0;gap:10px}
.pane{margin:0}
.boardwrap{flex:1;min-height:0;container-type:size;position:relative;display:flex;align-items:center;justify-content:center}
#mecard{flex:none;max-height:36%;overflow:auto}
#act{flex:none;max-height:58%;overflow:auto}
.tabs{display:flex;gap:6px;flex:none}.tabs button{flex:1;min-height:40px;padding:4px 8px}.tabs button.sel{background:var(--gold);color:#1a1420;border-color:var(--gold);font-weight:700}.tabs{display:none!important}
.backb{min-height:40px;padding:4px 14px;background:var(--gold);color:#1a1420;border-color:var(--gold);font-weight:900}
#logs{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.lg{display:flex;flex-direction:column;min-height:0;padding:10px 10px 6px;margin:0}.lh{margin:0 0 6px;font-family:"Black Han Sans";font-size:17px;flex:none}
#pubs,#feed{flex:1;min-height:0;max-height:none;overflow-y:auto}
.lg .it{font-size:14px;padding:6px 8px}
@media(max-width:860px){.main{display:flex;flex-direction:column;gap:8px}.left,.right{display:contents}
 .boardwrap{flex:none;height:34dvh;order:1}.tabs{order:2;display:flex!important}.tabs button{font-size:14px;padding:4px}
 .pane{order:3;display:none!important;flex:1;min-height:0;max-height:none!important;overflow:auto}
 #game[data-tab=act] #act,#game[data-tab=me] #mecard{display:block!important}#game[data-tab=log] #logs{display:grid!important;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
 .card{padding:12px}.top h2{font-size:20px}.top{gap:8px}}
.it .chip{font-size:13px;padding:0 5px}
.boardbox{position:relative;width:min(100cqw,100cqh);height:min(100cqw,100cqh);border-radius:50%;background:radial-gradient(circle,#2c2238 0%,#18131f 70%);box-shadow:0 0 0 2px #2d2539,0 30px 60px #0008}
.boardbox svg{position:absolute;inset:0;width:100%;height:100%}
.fog{position:absolute;inset:-4%;border-radius:50%;pointer-events:none;opacity:0;transition:opacity 1.2s;background:radial-gradient(circle at 30% 40%,#cfc6dd55,transparent 40%),radial-gradient(circle at 70% 60%,#cfc6dd44,transparent 45%),radial-gradient(circle at 50% 85%,#cfc6dd33,transparent 40%);background-size:200% 200%;animation:drift 14s linear infinite;filter:blur(8px)}
.fog.on{opacity:1}.night .boardbox{background:radial-gradient(circle,#1d1830 0%,#0b0910 70%)}
@keyframes drift{0%{background-position:0% 50%}50%{background-position:100% 40%}100%{background-position:0% 50%}}
@media(prefers-reduced-motion:reduce){.fog,#timer.hot{animation:none}}
#banner{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:min(92%,420px);text-align:center;background:#000d;border:1px solid var(--red);border-radius:14px;padding:12px;font-weight:700;white-space:pre-line}
#act h3{font-size:22px;margin-bottom:8px}
.hint{color:var(--dim);font-size:14px;margin:4px 0 10px}
.tgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin:8px 0}
.tg{border-left:8px solid var(--c);text-align:left;padding:6px 10px;line-height:1.2}
.tg small{display:block;color:var(--dim);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-block;padding:0 7px;border-radius:6px;background:var(--c);color:#111;font-weight:700;font-size:14px;line-height:1.5}
.list{max-height:330px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.it{background:var(--pan2);border-radius:10px;padding:8px 10px;font-size:15px;display:flex;gap:8px;align-items:center}
.it .tx{flex:1}.it .d{color:var(--dim);font-size:13px;flex:none}
.it button{min-height:36px;padding:4px 10px;font-size:14px;flex:none}
.it.sys{background:#2a1820;border-left:4px solid var(--red)}.it.tip{border-left:4px solid var(--gold)}
.role{font-family:"Black Han Sans";font-size:34px;color:var(--gold)}
.sec{margin-top:14px}
.mod{position:fixed;inset:0;background:#000c;display:none;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;z-index:9}
.mod .card{max-width:680px;width:100%}
.mod li{margin:4px 0}.sum{padding-left:20px;font-size:17px}.sum li{margin:6px 0}.roles{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}.roles li{background:var(--pan2);border-radius:10px;padding:8px 10px;margin:0;font-size:15px}.roles b{display:block;color:var(--gold)}
#now{background:#f2c14e;color:#1a1420;font-weight:700;border-radius:10px;padding:8px 12px;margin-bottom:10px;display:none}
table{border-collapse:collapse;width:100%}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left}
.empty{color:var(--dim);font-size:14px}
</style></head><body>
<div id="menu">
  <h1>범인찾기</h1>
  <p class="sub">안개 낀 밤, 원탁의 4~7명 중 숨은 범인을 찾아라</p>
  <div class="card">
    <p class="lbl">내 이름</p>
    <input id="nm" maxlength="8" placeholder="이름 (최대 8자)" style="width:100%">
    <p class="lbl" style="margin-top:12px">내 색 (원하는 색, 이미 누가 쓰면 다른 색이 돼요)</p><div class="tgs" id="mcol"></div>
  </div>
  <div class="card">
    <p class="lbl">방 만들기 / 혼자 하기</p>
    <div class="row">
      <select id="capSel" aria-label="인원"><option value="4">4인</option><option value="5">5인</option><option value="6">6인</option><option value="7" selected>7인</option></select>
      <button class="pri" id="bHost">방 만들기 (온라인)</button>
      <button id="bSolo">혼자 하기 (AI)</button>
    </div>
  </div>
  <div class="card">
    <p class="lbl">친구 방에 참가</p>
    <div class="row"><input id="code" maxlength="4" placeholder="방 코드 4자리" style="text-transform:uppercase"><button class="pri" id="bJoin">참가</button></div>
  </div>
  <p id="mmsg" class="hint"></p>
  <button id="bRules">게임 규칙 보기</button>
</div>

<div id="game" data-tab="act">
  <div class="top"><button data-x="back" aria-label="뒤로가기" class="backb">← 뒤로가기</button><h2>범인찾기</h2><span id="phase"></span><button id="bRules2" style="min-height:36px;padding:4px 10px">규칙</button><button data-x="snd" id="bSnd" style="min-height:36px;padding:4px 10px">소리 끄기</button><span id="timer"></span></div>
  <div id="now"></div>
  <div class="main">
    <div class="left">
      <div class="boardwrap"><div class="boardbox"><svg id="board" viewBox="0 0 400 400"></svg><div class="fog" id="fog"></div></div><div id="banner"></div></div>
      <div class="card pane" id="mecard"></div>
    </div>
    <div class="right">
      <div class="card pane" id="act"></div>
      <div class="tabs"><button data-x="tab" data-v="act">할 일</button><button data-x="tab" data-v="log">게시판 · 본 것</button><button data-x="tab" data-v="me">내 정보</button></div>
      <div class="pane" id="logs"><div class="card lg"><p class="lh">공개 게시판</p><div class="list" id="pubs"></div></div><div class="card lg"><p class="lh">내가 본 것</p><div class="list" id="feed"></div></div></div>
    </div>
  </div>
</div>
<div class="mod" id="whoMod" data-x="whox"><div class="card" id="who"></div></div>
<div class="mod" id="deadMod" data-x="dclose"><div class="card" style="max-width:420px;margin-top:18vh;text-align:center;border-color:var(--red)"><h2 style="font-size:34px;color:var(--red)">당신은 죽었습니다</h2><p id="dmsg" style="font-size:19px;font-weight:700"></p><button class="pri" data-x="dclose">확인</button></div></div>
<div class="mod" id="histMod"><div class="card" style="max-width:760px"><div class="row"><h2 style="font-size:28px;color:var(--gold)">게임 기록</h2><button data-x="hclose" style="margin-left:auto">닫기</button></div><div id="histBody" class="sec"></div><button class="pri sec" data-x="hclose">닫기</button></div></div>
<div class="mod" id="confirm"><div class="card" style="max-width:420px;margin-top:20vh"><p id="cmsg" style="font-size:18px;font-weight:700;margin-top:0"></p><div class="row"><button class="pri" data-x="cyes">나가기</button><button data-x="cno">계속하기</button></div></div></div>

<div class="mod" id="rules"><div class="card">
<h2 style="font-size:30px;color:var(--red)">게임 규칙</h2>
<ol class="sum"><li>범인을 투표로 잡으면 <b>시민 승리</b>, 범인이 다 죽이면 <b>범인 승리</b>.</li>
<li>낮엔 말하고, 밤엔 능력을 써요. 안개 낀 동안엔 내 양옆만 보여요.</li>
<li>3일째부터 회의: 본 것 하나 공개하고 투표해요.</li></ol>
<ul id="roleList" class="roles"></ul>
<button class="pri" id="bClose">닫기</button>
</div></div>

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const josa=(w,a,b)=>{const c=w.charCodeAt(w.length-1);return w+((c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28)?a:b)};
const COLORS=[['빨강','#e5383b'],['주황','#f3722c'],['노랑','#f9c74f'],['초록','#43aa8b'],['파랑','#3a86ff'],['남색','#5b55e0'],['보라','#b06be6']];
const JOBS=['범인','경찰','군인','의사','버스기사','백수','기자','목사','정치인','환자','탐정'];
const DESC={범인:'밤마다 한 명을 죽여요.',
경찰:'한 명을 몸수색해서 흔적을 봐요.',
군인:'나를 노린 범인을 반격해요. 같은 사람을 3밤 겨누면 쏴요.',
의사:'한 명을 살려요. 시신 검사, 수술(1번)도 돼요.',
버스기사:'두 사람의 대상을 바꿔요.',
백수:'범인을 찍어요. 맞히면 범인 편이 돼요.',
기자:'모두의 말을 봐요. 하루 한 번 몰래 제보해요.',
목사:'나와 한 사람의 대상을 바꿔요.',
정치인:'남의 투표권을 뺏어요. 투표로 뽑히면 혼자 이겨요.',
환자:'한 명의 다음 밤 행동을 막아요.',
탐정:'한 명의 느낌 힌트를 받아요.',
공범:'범인 편이에요. 능력은 없어요.'};
const FAKE_OK=['정치인','공범','환자','범인','군인','경찰'];
const METHODS=['교살','타살','독','총살','칼'];
const TRACES=['저항흔적','피','주사기','화약가루'];
const T_SEC=20000,MEET=120000,PFX='beominchakgi-v1-';
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let PREF=0;try{const c=localStorage.getItem('bm-col');if(c!==null)PREF=+c}catch(e){}
const BOTN=['알파','베타','감마','델타','시그마','오메가','제타'];

/* ================= HOST ENGINE ================= */
let G=null,NOW=()=>Date.now();
const P=i=>G.players[i];
const cn=i=>COLORS[P(i).col][0];
const alive=()=>G.players.filter(p=>p.alive);
const teamOf=r=>r==='범인'||r==='공범'?'K':r==='정치인'?'N':'T';
const sideOf=p=>p.team==='K'||(p.role==='백수'&&p.found)?'K':p.team;
function setPhase(ph,ms){G.phase=ph;G.deadline=NOW()+ms;G.done={};G.tok++;G.dirty=true}
function later(ms,fn){const tok=G.tok;G.q.push({at:NOW()+ms,fn,tok})}
function laterBot(p,ms,fn){later(ms,()=>{if(p.ai&&p.alive)fn()})}
function sysMsg(text,kind){G.board.push({day:G.day,kind:kind||'sys',text});G.dirty=true}
function see(pid,it){it.id=++G.fid;it.day=G.day;it.ph=G.phase==='night'?'밤':'낮';P(pid).feed.push(it);G.dirty=true}
function neighbors(pid){const al=G.players.filter(q=>q.alive||q.id===pid).sort((a,b)=>a.seat-b.seat);const n=al.length;if(n<2)return[];const i=al.findIndex(q=>q.id===pid);return[...new Set([al[(i-1+n)%n].id,al[(i+1)%n].id])].filter(x=>x!==pid)}
function seeAround(pid,mk){const ns=neighbors(pid);const rs=G.players.filter(q=>q.alive&&q.role==='기자'&&q.id!==pid&&!ns.includes(q.id)).map(q=>q.id);for(const n of[...ns,...rs])see(n,mk())}

function newGame(code,name,cap,solo){G={phase:'lobby',code,cap,solo,players:[],board:[],fid:0,q:[],tok:0,dirty:true,started:false,day:0,deadline:0,done:{},pubd:new Set()};addPlayer(name,false,'host',PREF)}
function addPlayer(name,ai,link,pref){if(G.players.length>=G.cap)return null;const i=G.players.length;const used=new Set(G.players.map(q=>q.col));const p={id:i,name,col:(pref>=0&&pref<7&&!used.has(pref))?pref:[0,1,2,3,4,5,6].find(c=>!used.has(c)),seat:i,ai,link,alive:true,feed:[]};G.players.push(p);G.dirty=true;return p}
function reindex(){G.players.forEach((p,i)=>{p.id=i;p.seat=i});G.dirty=true}
function fillAI(){let k=0;while(G.players.length<G.cap){const used=new Set(G.players.map(p=>p.name));let n=BOTN.find(b=>!used.has(b+' AI'))||('봇'+k);addPlayer(n+' AI',true,null);k++}}

function startGame(){
  fillAI();const N=G.players.length,nk=N>=6?2:1;
  const pool=JOBS.filter(j=>j!=='범인'&&!(nk===2&&j==='백수'));
  const roles=shuffle([...Array(nk).fill('범인'),...shuffle(pool).slice(0,N-nk)]);
  G.players.forEach((p,i)=>{Object.assign(p,{role:roles[i],orig:roles[i],alive:true,feed:[],trace:null,claim:null,fake:null,blockNight:-1,usedSurg:false,byKiller:false,cause:null,found:false,polWin:false,hist:0,lastT:null,examined:[],win:false,deaths:0});p.team=teamOf(p.role);if(p.role==='범인')p.fake=rnd(pool.filter(j=>j!=='백수'))});
  G.hist=[];G.started=true;G.day=0;G.board=[];G.pubd=new Set();G.dlog=[];G.method=null;G.steal=null;G.foundFlag=false;G.center={};G.centerM=null;
  G.centerBy=G.players.filter(p=>p.role==='범인').sort((a,b)=>a.seat-b.seat)[0].id;
  G.players.filter(p=>p.team==='K').forEach(p=>see(p.id,{k:'info',text:'범인: '+G.players.filter(q=>q.team==='K').map(q=>cn(q.id)).join(', ')+(p.fake?` · 내 가짜 직업은 ${p.fake}`:'')}));
  setPhase('intro',T_SEC);sysMsg('게임 시작! 원 가운데에 한 사람이 앉아 있다…');
  const c=P(G.centerBy);if(c.ai)laterBot(c,1500+Math.random()*2500,()=>hostAct(c.id,{a:'center',m:rnd(METHODS)}));
}
function pause(text,ms,next){G.banner=text;setPhase('pause',ms);G.next=next}
const centerOpts=()=>METHODS.filter(m=>m!==G.prevMethod);
function doCenter(){const m=G.centerM||rnd(centerOpts());G.method=m;const kt=traceOf(m);G.players.forEach(p=>{p.trace=p.role==='범인'||p.role==='군인'?kt:rnd(TRACES)});
  H('직업: '+G.players.map(p=>`${cn(p.id)} ${p.role}`).join(', '));H(`범인이 가운데 사람을 ${ro(m)} 죽였다. 살인 방법은 ${ro(m)} 고정, 범인의 흔적은 ${kt}`);H('흔적: '+G.players.map(p=>`${cn(p.id)} ${p.trace}`).join(', '));
  G.players.filter(p=>p.team==='K').forEach(p=>see(p.id,{k:'info',text:`가운데 사람을 ${m}(으)로 죽였다. 이번 게임의 살인 방법은 ${m}(으)로 고정된다.`}));
  sysMsg('원 가운데 사람이 살해당했다. 짙은 안개가 끼고, 모두의 몸에 알 수 없는 흔적이 남았다.');
  pause('원 가운데 사람이 살해당했다!\n안개가 끼기 시작한다…',6500,()=>startDay(1))}

    else if(a.a==='delai'){const i=G.players.map(q=>q.ai).lastIndexOf(true);if(i>0){G.players.splice(i,1);reindex()}}

  if(!p.alive)return;

    case 'tip':{if(p.role!=='기자'||!['fog','meet'].includes(G.phase)||G.tipDay===G.day)break;const it=p.feed.find(x=>x.id===a.fid);if(!it||it.who===pid)break;
      H(`기자 ${cn(pid)} 몰래 제보: ${it.text}`);G.tipDay=G.day;G.pubd.add(pid+':'+a.fid);G.board.push({day:G.day,kind:'tip',by:-1,text:"기자 제보 · "+(it.ph==="낮"?`[${it.day}일차 낮] `:"")+it.text,it});G.dirty=true;break}

      H(`범인 ${cn(pid)}의 직업 추리: ${cn(t.id)}는 ${a.job}? → ${t.role===a.job?'적중!':'실패'}`);
      if(t.role===a.job){G.gallows=t.id;delete G.votes[t.id];sysMsg(`범인의 직업 추리가 적중했다! ${josa(cn(t.id),'이','가')} 처형대에 올랐다. (투표권 무효)`)}else see(pid,{k:'info',text:`직업 추리 실패: ${cn(t.id)}는 ${a.job}가 아니었다.`});G.dirty=true;break}

/* ---------- AI ---------- */
function seenItems(p){const m=new Map();p.feed.forEach(it=>m.set(it.id,it));G.board.forEach(b=>{if(b.it)m.set(b.it.id,b.it)});return[...m.values()]}
const nightVic=(n,t)=>G.dlog.some(d=>d.ph==='밤'&&d.day===n&&d.pid===t);
function sus(p){const s={};alive().forEach(q=>{if(q.id!==p.id)s[q.id]=Math.random()*.8});const add=(w,x)=>{if(s[w]!==undefined)s[w]+=x};const claims={};
  const SI=seenItems(p);const kt=new Set(SI.filter(it=>it.k==='doc'&&METHODS.includes(it.v)).map(it=>traceOf(it.v)));if(p.team==='K'||p.role==='군인')kt.add(p.trace);
  for(const it of SI){const w=it.who;
    if(it.k==='trace'&&TRACES.includes(it.v))add(w,kt.size?(kt.has(it.v)?2.5:-.8):.3);
    if(it.k==='police'){if(TRACES.includes(it.v))add(w,kt.size?(kt.has(it.v)?4:-1):1.2);else if(it.v==='없음')add(w,-1)}
    if(it.k==='det')add(w,{범인인거같다:2.5,무서워보인다:1,선량해보인다:-1.5}[it.v]||0);
    if(it.k==='pick'&&it.tgt!=null&&nightVic(it.night,it.tgt))add(w,2.5);
    if(it.k==='rep'&&nightVic(it.night,w))it.cs.forEach(c=>add(c,1.5));
    if(it.k==='hb'&&it.yes)add(w,p.role==='백수'&&p.found?-99:10);
    if(it.k==='claim')(claims[it.v]=claims[it.v]||new Set()).add(w)}
  for(const j in claims)if(claims[j].size>1)claims[j].forEach(w=>add(w,1.5));
  if(p.team==='K')G.players.forEach(q=>{if(q.team==='K'&&s[q.id]!==undefined)s[q.id]=-99});return s}
function interest(p,it){if(it.who===p.id||G.pubd.has(p.id+':'+it.id))return 0;
  const isK=w=>P(w)&&P(w).team==='K';let sc=0;
  if(it.k==='trace')sc=1.2;else if(it.k==='police')sc=TRACES.includes(it.v)?4:.8;else if(it.k==='det')sc=it.v==='범인인거같다'?3:it.v==='무서워보인다'?1.5:.5;
  else if(it.k==='pick')sc=(it.tgt!=null&&nightVic(it.night,it.tgt))?3:.3;else if(it.k==='rep')sc=nightVic(it.night,it.who)?2:.5;else if(it.k==='doc')sc=1.5;else if(it.k==='claim')sc=.4;
  if(p.team==='K'&&isK(it.who)&&it.k!=='claim')return 0;if(p.found&&it.k==='hb')return 0;return sc+Math.random()*.5}
function bestItem(p){let b=null,bs=.6;for(const it of p.feed){const s=interest(p,it);if(s>bs){bs=s;b=it}}return b}
function botFog(p){const o=fogOpts(p);let v;
  if(G.day===1)v=p.role==='범인'?(Math.random()<.7?rnd(TRACES.filter(t=>t!==p.trace)):p.trace):o[0];
  else if(p.role==='범인')v=p.fake;else if(p.role==='공범')v=Math.random()<.5?'백수':rnd(['의사','목사','기자','탐정']);
  else if(p.role==='정치인')v=Math.random()<.5?'정치인':rnd(['의사','목사','기자']);else v=p.role;
  hostAct(p.id,{a:'fog',v:o.includes(v)?v:fogDef(p)})}
function botTip(p){if(Math.random()<.7){const it=bestItem(p);if(it)hostAct(p.id,{a:'tip',fid:it.id})}}
function botNight(p){const sp=nightSpec(p),s=sus(p),T=sp.targets||[];const top=()=>T.filter(t=>t!==p.id).sort((a,b)=>(s[b]||0)-(s[a]||0))[0];let a={none:true};
  switch(p.role){
    case '범인':{const seen=seenItems(p);const sc=t=>{let x=Math.random()*2;seen.forEach(it=>{if(it.k==='claim'&&it.who===t&&['경찰','탐정','기자','의사'].includes(it.v))x+=2});x+=G.board.filter(b=>b.by===t).length*.7;return x};
      const t=T.slice().sort((a,b)=>sc(b)-sc(a))[0];a={t,m:rnd(sp.methods)};break}
    case '경찰':case '탐정':{const done=new Set(p.feed.filter(i=>i.k===(p.role==='경찰'?'police':'det')).map(i=>i.who));const c=T.filter(t=>!done.has(t));const pool=c.length?c:T;
      a={t:rnd(pool)};break}
    case '군인':{const t=top();if(t!=null&&(s[t]>=3||(p.lastT===t&&s[t]>=1.5)))a={t};break}
    case '의사':{const C=sp.corpses;const un0=C.filter(c=>!p.examined.includes(c));if(!(sp.surgery&&C.some(c=>P(c).byKiller))&&(!un0.length||Math.random()<.65)){const s2=sus(p);const safe=sp.targets.filter(t=>t===p.id||(s2[t]||0)<1.5);a={t:Math.random()<.3?p.id:rnd(safe.length?safe:sp.targets),mode:'heal'};break}if(C.length){const vic=C.filter(c=>P(c).byKiller);const pat=vic.find(c=>seenItems(p).some(it=>it.k==='claim'&&it.who===c&&it.v==='환자'));
      if(sp.surgery&&(pat!=null||(vic.length&&Math.random()<.25)))a={t:pat!=null?pat:rnd(vic),mode:'surg'};else{const un=C.filter(c=>!p.examined.includes(c));if(un.length)a={t:un[un.length-1],mode:'exam'}}}break}
    case '버스기사':if(Math.random()<.35){const x=shuffle(T);a={t:x[0],t2:x[1]}}break;
    case '백수':{const g=new Set(p.feed.filter(i=>i.k==='hb').map(i=>i.who));const c=T.filter(t=>!g.has(t));if(c.length)a={t:Math.random()<.5?top():rnd(c)};break}
    case '목사':if(Math.random()<.25)a={t:rnd(T)};break;
    case '환자':a={t:top()};break;
    case '기자':a={t:Math.random()<.5?top():rnd(T)};break;
    default:if(T.length)a={t:rnd(T)}}
  if(a.t==null&&!a.none)a={none:true};
  hostAct(p.id,Object.assign({a:'night'},a));if(G.phase==='night'&&G.order[G.ti]===p.id)nightTimeout()}
function botVote(p){const s=sus(p);const c=alive().filter(q=>q.id!==p.id&&(sideOf(p)!=='K'||q.team!=='K')).map(q=>q.id);if(!c.length)return -1;
  const t=c.sort((a,b)=>s[b]-s[a])[0];if(s[t]>=2)return t;return Math.random()<.55?-1:rnd(c)}
function botMeet(p){const n=1;
  for(let i=0;i<n;i++)laterBot(p,8000+Math.random()*50000,()=>{const it=bestItem(p);if(it)hostAct(p.id,{a:'pub',fid:it.id})});
  if(p.role==='기자')laterBot(p,6000+Math.random()*30000,()=>botTip(p));
  if(G.day===4&&p.role==='범인'&&Math.random()<.6)laterBot(p,8000+Math.random()*25000,()=>{const cl=seenItems(p).filter(it=>it.k==='claim'&&P(it.who).alive&&P(it.who).team!=='K');if(cl.length){const it=rnd(cl);hostAct(p.id,{a:'guess',t:it.who,job:it.v})}});
  laterBot(p,45000+Math.random()*60000,()=>hostAct(p.id,{a:'vote',t:botVote(p)}))}
function botNow(p){if(!p.alive)return;if(G.phase==='fog'&&!G.done[p.id])laterBot(p,800,()=>botFog(p));else if(G.phase==='night'&&G.order[G.ti]===p.id)laterBot(p,800,()=>botNight(p));else if(G.phase==='meet')botMeet(p);else if(G.phase==='intro'&&G.centerBy===p.id&&!G.centerM)laterBot(p,800,()=>hostAct(p.id,{a:'center',m:rnd(centerOpts())}))}

function tick(){if(!G)return;const now=NOW();
  const due=G.q.filter(x=>x.at<=now);G.q=G.q.filter(x=>x.at>now);due.forEach(x=>{if(x.tok===G.tok)try{x.fn()}catch(e){console.error(e)}});
  switch(G.phase){
    case 'intro':if(now>=G.deadline||G.centerM)doCenter();break;
    case 'pause':if(now>=G.deadline){const f=G.next;G.next=null;f&&f()}break;
    case 'fog':if(now>=G.deadline||alive().every(p=>G.done[p.id]))endFog();break;
    case 'night':if(now>=G.deadline)nightTimeout();break;
    case 'meet':if(now>=G.deadline||alive().every(p=>G.votes[p.id]!==undefined||voidReason(p)))endMeet();break}
  if(G.dirty){G.dirty=false;pushViews()}}

function promptFor(p){if(!p.alive)return null;
  const tip=p.role==='기자'&&['fog','meet'].includes(G.phase)&&G.tipDay!==G.day;

    case 'fog':return{k:'fog',kind:G.day===1?'trace':'claim',opts:fogOpts(p),def:fogDef(p),done:!!G.done[p.id],tip};
    case 'night':return G.order[G.ti]===p.id?Object.assign({k:'night',role:p.role,blocked:p.blockNight===G.day,sold:p.role==='군인'?{t:p.lastT,n:p.hist}:null},nightSpec(p)):{k:'wait'};

document.addEventListener('click',e=>{const el=e.target.closest('[data-x]');if(!el||!V)return;const x=el.dataset.x,v=el.dataset.v,pr=V.pr;const n=v!==undefined&&v!==''&&!isNaN(+v)?+v:v;
  switch(x){
    case 'copy':{const i=$('#lnk');try{navigator.clipboard.writeText(i.value).then(()=>{el.textContent='복사됨'},()=>{i.select()})}catch(_){i.select()}return}
    case 'addai':case 'delai':case 'start':case 'again':case 'shuffle':send({a:x});return;
    case 'color':send({a:'color',c:n});return;
    case 'back':case 'leave':askLeave();return;
    case 'menu':if(iAmHost&&G&&!G.solo&&G.players.some(p=>p.link&&p.link!=='host')){confirmAct='';$('[data-x="cyes"]').textContent='나가기';$('#cmsg').textContent='방장이 나가면 방이 닫혀요. 나갈까요?';$('#confirm').style.display='flex'}else leaveGame();return;
    case 'cyes':$('#confirm').style.display='none';if(confirmAct==='lobby'){confirmAct='';send({a:'tolobby'})}else leaveGame();return;
    case 'cno':$('#confirm').style.display='none';return;
    case 'hist':openHist();return;case 'hclose':$('#histMod').style.display='none';return;
    case 'dclose':$('#deadMod').style.display='none';return;
    case 'center':send({a:'center',m:v});return;
    case 'fog':send({a:'fog',v});return;
    case 'pub':send({a:'pub',fid:n});return;
    case 'who':WHO=n;break;case 'whox':if(e.target.closest('#who')&&!e.target.closest('button'))return;WHO=null;break;
    case 'tab':TAB=v;break;
    case 'snd':Snd.toggle();el.textContent=Snd.on?'소리 끄기':'소리 켜기';return;
    case 'tip':send({a:'tip',fid:n});return;
    case 'seat':if(pr&&pr.k==='night'&&((pr.targets&&pr.targets.includes(n))||(pr.corpses&&pr.corpses.includes(n))))pick(n,pr);else WHO=n;break;
    case 't':if(pr&&pr.k==='night')pick(n,pr);else S.t=n;break;
    case 'm':S.m=v;break;case 'mode':S.mode=v;S.t=null;break;case 'gt':S.gt=n;break;case 'gj':S.gj=v;break;
    case 'go':send({a:'night',t:S.t,t2:S.t2,m:S.m,mode:S.mode});return;
    case 'none':send({a:'night',none:true});return;
    case 'vote':if(S.t!=null)send({a:'vote',t:S.t});return;
    case 'guess':send({a:'guess',t:S.gt,job:S.gj});return;
    default:return}
  render()});
function pick(n,pr){if(pr.two){if(S.t===n)S.t=S.t2,S.t2=null;else if(S.t2===n)S.t2=null;else if(S.t==null)S.t=n;else S.t2=n}else S.t=n}
document.addEventListener('change',e=>{if(e.target.id==='cap2')send({a:'cap',v:+e.target.value})});
$('#bHost').onclick=hostOnline;$('#bSolo').onclick=solo;$('#bJoin').onclick=join;
const openR=()=>{$('#rules').style.display='flex'};$('#bRules').onclick=openR;$('#bRules2').onclick=openR;$('#bClose').onclick=()=>{$('#rules').style.display='none'};
$('#roleList').innerHTML=JOBS.concat('공범').map(j=>`<li><b>${j}</b>${esc(DESC[j])}</li>`).join('');
try{$('#nm').value=localStorage.getItem('bm-name')||''}catch(e){}
function drawMcol(){$('#mcol').innerHTML=COLORS.map(([n,c],i)=>`<button type="button" class="tg ${PREF===i?'on':''}" data-mc="${i}" style="--c:${c}">${n}</button>`).join('')}
$('#mcol').addEventListener('click',e=>{const b=e.target.closest('[data-mc]');if(!b)return;PREF=+b.dataset.mc;try{localStorage.setItem('bm-col',PREF)}catch(_){}drawMcol()});drawMcol();
const qr=new URLSearchParams(location.search).get('room');if(qr){$('#code').value=qr.toUpperCase().slice(0,4);$('#mmsg').textContent='이름을 입력하고 참가를 누르세요.'}
let WHO=null;
let TAB='act';
function renderWho(){const w=$('#who'),md=$('#whoMod');if(WHO==null||!V.ps[WHO]){md.style.display='none';return}md.style.display='flex';const q=V.ps[WHO];const L=V.board.filter(b=>b.kind==='pub'&&b.by===WHO);
  w.style.display='block';w.innerHTML=`<div class="row">${chip(WHO)}<b>${esc(q.n)}</b>${q.alive?'':'<span style="color:var(--red)">사망</span>'}<button data-x="whox" style="margin-left:auto;min-height:36px">닫기</button></div><p class="lbl sec">이 사람이 공개한 것 (${L.length})</p><div class="list">${L.length?L.map(b=>`<div class="it"><span class="d">${b.day}일</span><span class="tx">${colz(b.text)}</span></div>`).join(''):'<p class="empty">아직 공개한 것이 없어요.</p>'}</div>`}
/* ---------- spooky BGM (WebAudio, no files) ---------- */
const Snd={ctx:null,on:true,night:false,f:null,m:null,t:0,
  init(){if(this.ctx||!this.on)return;try{const C=new (window.AudioContext||window.webkitAudioContext)();this.ctx=C;
    const m=C.createGain();m.gain.value=.0001;m.connect(C.destination);this.m=m;m.gain.exponentialRampToValueAtTime(.5,C.currentTime+3);
    const f=C.createBiquadFilter();f.type='lowpass';f.frequency.value=380;f.Q.value=4;f.connect(m);this.f=f;
    [55,55.6,82.4].forEach((hz,i)=>{const o=C.createOscillator();o.type=i<2?'sawtooth':'triangle';o.frequency.value=hz;const g=C.createGain();g.gain.value=i<2?.09:.05;o.connect(g);g.connect(f);o.start()});
    const lfo=C.createOscillator();lfo.frequency.value=.07;const lg=C.createGain();lg.gain.value=160;lfo.connect(lg);lg.connect(f.frequency);lfo.start();
    const nb=C.createBuffer(1,C.sampleRate*3,C.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const ns=C.createBufferSource();ns.buffer=nb;ns.loop=true;const bp=C.createBiquadFilter();bp.type='bandpass';bp.frequency.value=500;bp.Q.value=.7;const wg=C.createGain();wg.gain.value=.035;
    const wl=C.createOscillator();wl.frequency.value=.11;const wlg=C.createGain();wlg.gain.value=.03;wl.connect(wlg);wlg.connect(wg.gain);wl.start();ns.connect(bp);bp.connect(wg);wg.connect(m);ns.start();
    const dl=C.createDelay();dl.delayTime.value=.42;const fb=C.createGain();fb.gain.value=.45;dl.connect(fb);fb.connect(dl);dl.connect(m);this.dl=dl;
    this.bell();}catch(e){this.ctx=null}},
  bell(){const C=this.ctx;if(!C)return;const N=this.night?[220,261.6,311.1,207.7,233.1]:[440,523.3,622.3,659.3,415.3,493.9];
    if(this.on){const o=C.createOscillator(),g=C.createGain(),t=C.currentTime;o.type='sine';o.frequency.value=N[Math.floor(Math.random()*N.length)];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.09,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+2.2);o.connect(g);g.connect(this.m);g.connect(this.dl);o.start(t);o.stop(t+2.3)}
    clearTimeout(this.t);this.t=setTimeout(()=>this.bell(),(this.night?3800:2600)+Math.random()*3500)},
  mood(n){this.night=n;if(this.f&&this.ctx)this.f.frequency.setTargetAtTime(n?220:380,this.ctx.currentTime,1.5)},
  tick(){const C=this.ctx;if(!C||!this.on)return;const o=C.createOscillator(),g=C.createGain(),t=C.currentTime;o.type='square';o.frequency.value=1200;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+.06);o.connect(g);g.connect(this.m);o.start(t);o.stop(t+.07)},
  toggle(){this.on=!this.on;try{localStorage.setItem('bm-snd',this.on?'1':'0')}catch(e){}if(this.on){if(!this.ctx)this.init();else{this.ctx.resume();this.m.gain.setTargetAtTime(.5,this.ctx.currentTime,.5)}}else if(this.ctx)this.m.gain.setTargetAtTime(.0001,this.ctx.currentTime,.3)}};
try{Snd.on=localStorage.getItem('bm-snd')!=='0'}catch(e){}
$('#bSnd').textContent=Snd.on?'소리 끄기':'소리 켜기';
document.addEventListener('pointerdown',()=>{if(Snd.on&&!Snd.ctx)Snd.init()},{once:false});
window.__bm={get G(){return G},newGame,startGame,tick,setNow:f=>{NOW=f},hostAct,viewFor,render:()=>render()};
}
</script>
